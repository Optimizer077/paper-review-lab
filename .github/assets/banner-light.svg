<text x="128" y="88" class="muted small">A careful argument. A better revision.</text>
<text x="60" y="187" font-size="65" class="heading">Write with clarity.</text>
<text x="60" y="266" font-size="65" class="heading accent">Revise with evidence.</text>
<text x="63" y="309" font-size="18" class="muted">An iterative writing skill for the agent you already use.</text>
