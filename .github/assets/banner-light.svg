<text x="936" y="166" font-size="16" font-weight="600">Draft a bounded claim</text><text x="936" y="186" class="small muted">Keep its evidence and conditions.</text>
<text x="936" y="226" font-size="16" font-weight="600">Invite independent views</text><text x="936" y="246" class="small muted">A fresh reader. A focused specialist.</text>
