<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="268" viewBox="0 0 1280 268" role="img" aria-labelledby="title desc">
<title id="title">Write, review, verify, explore</title><desc id="desc">Four capabilities: evidence-grounded writing; selected independent reviewers; mechanical checks and verified issue closure; 42 writing resources and 10,000 citation metadata records.</desc>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#f8fafc}.muted{fill:#a3b2cb}.accent{fill:#a5b4fc}.mint{fill:#5eead4}.mono{font-family:'Cascadia Code',Consolas,monospace;letter-spacing:1.6px}.small{font-size:13px}.label{font-size:11px;font-weight:600;letter-spacing:2px}.heading{font-weight:650;letter-spacing:-1px}</style>
<rect width="1280" height="268" rx="20" fill="#0b1220"/>
<text x="32" y="42" class="mono label muted">A CONNECTED RESEARCH WORKFLOW</text><rect x="24" y="65" width="294" height="179" rx="12" fill="#111d31" stroke="#273750"/><text x="44" y="95" class="mono label accent">01 / WRITE</text><text x="44" y="135" font-size="16" font-weight="600">A question readers can follow.</text><text x="44" y="170" class="small muted">Draft and revise within your</text><text x="44" y="191" class="small muted">actual scientific evidence.</text><rect x="338" y="65" width="294" height="179" rx="12" fill="#111d31" stroke="#273750"/><text x="358" y="95" class="mono label accent">02 / REVIEW</text><text x="358" y="135" font-size="16" font-weight="600">Complementary perspectives.</text><text x="358" y="170" class="small muted">Select reviewers, preserve blind</text><text x="358" y="191" class="small muted">reading and reconcile findings.</text><rect x="652" y="65" width="294" height="179" rx="12" fill="#111d31" stroke="#273750"/><text x="672" y="95" class="mono label accent">03 / VERIFY</text><text x="672" y="135" font-size="16" font-weight="600">A revision you can inspect.</text><text x="672" y="170" class="small muted">Check facts, track issue closure</text><text x="672" y="191" class="small muted">and reject stale review reports.</text><rect x="966" y="65" width="294" height="179" rx="12" fill="#111d31" stroke="#273750"/><text x="986" y="95" class="mono label accent">04 / EXPLORE</text><text x="986" y="135" font-size="16" font-weight="600">Useful sources, clearly scoped.</text><text x="986" y="170" class="small muted">42 writing resources and 10,000</text><text x="986" y="191" class="small muted">historical citation records.</text></svg>
