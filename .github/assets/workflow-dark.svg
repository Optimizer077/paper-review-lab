<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">A bounded iterative writing workflow</title><desc id="desc">Frame, draft, review, verify and refine. New revisions require fresh review packets. Default maximum three rounds, with explicit early stop conditions and optional scoring.</desc>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#f8fafc}.muted{fill:#a3b2cb}.accent{fill:#a5b4fc}.mint{fill:#5eead4}.mono{font-family:'Cascadia Code',Consolas,monospace;letter-spacing:1.6px}.small{font-size:13px}.label{font-size:11px;font-weight:600;letter-spacing:2px}.heading{font-weight:650;letter-spacing:-1px}</style>
<rect width="1280" height="360" rx="20" fill="#0b1220"/>
<text x="40" y="45" class="mono label muted">BOUNDED ROUNDS / FRESH INPUTS / VERIFIED CLOSURE</text><path d="M75 91h184m-7-5 7 5-7 5" fill="none" stroke="#273750" stroke-width="2"/><circle cx="54" cy="91" r="14" fill="#1c2a49"/><text x="54" y="95" text-anchor="middle" font-size="10" class="accent">01</text><text x="40" y="143" font-size="24" class="heading">Frame</text><text x="40" y="174" class="small muted">Question, sources,</text><text x="40" y="195" class="small muted">protected facts.</text><path d="M319 91h184m-7-5 7 5-7 5" fill="none" stroke="#273750" stroke-width="2"/><circle cx="298" cy="91" r="14" fill="#1c2a49"/><text x="298" y="95" text-anchor="middle" font-size="10" class="accent">02</text><text x="284" y="143" font-size="24" class="heading">Draft</text><text x="284" y="174" class="small muted">A clear argument,</text><text x="284" y="195" class="small muted">within its evidence.</text><path d="M563 91h184m-7-5 7 5-7 5" fill="none" stroke="#273750" stroke-width="2"/><circle cx="542" cy="91" r="14" fill="#1c2a49"/><text x="542" y="95" text-anchor="middle" font-size="10" class="accent">03</text><text x="528" y="143" font-size="24" class="heading">Review</text><text x="528" y="174" class="small muted">Selected specialists,</text><text x="528" y="195" class="small muted">fresh blind reading.</text><path d="M807 91h184m-7-5 7 5-7 5" fill="none" stroke="#273750" stroke-width="2"/><circle cx="786" cy="91" r="14" fill="#1c2a49"/><text x="786" y="95" text-anchor="middle" font-size="10" class="accent">04</text><text x="772" y="143" font-size="24" class="heading">Verify</text><text x="772" y="174" class="small muted">Inspect changed claims,</text><text x="772" y="195" class="small muted">reconcile the sections.</text><circle cx="1030" cy="91" r="14" fill="#1c2a49"/><text x="1030" y="95" text-anchor="middle" font-size="10" class="accent">05</text><text x="1016" y="143" font-size="24" class="heading">Refine</text><text x="1016" y="174" class="small muted">Fix supported issues;</text><text x="1016" y="195" class="small muted">preserve what holds.</text><path d="M1030 216v24H298v-24m-5 6 5-6 5 6" stroke="#5eead4" fill="none" stroke-width="2"/><text x="650" y="265" text-anchor="middle" class="mono small mint">REVIEW → REVISE → VERIFY · STOP WITH THE ACTUAL REASON</text><path d="M40 286h1200" stroke="#273750"/><text x="40" y="313" class="small muted">Default: up to 3 rounds. Stop sooner when the requested work is complete or essential evidence is unavailable.</text><text x="40" y="335" class="small muted">Your agent dispatches reviewers. Python prepares and validates packets. Scoring is optional.</text></svg>
